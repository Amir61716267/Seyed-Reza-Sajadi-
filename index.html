  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(-45deg, #080d1c, #14213d, #172554, #101827);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
      color: white;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .profile {
      width: 100%;
      max-width: 390px;
      padding: 38px 25px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 32px;
    }

    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: 0.25s ease;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .social:hover {
      transform: translateY(-4px);
      filter: brightness(1.12);
    }

    .eitaa {
      background: rgba(255, 125, 35, 0.18);
    }

    .soroush {
      background: rgba(40, 130, 255, 0.18);
    }

    .icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
      border-radius: 50%;
    }
  </style>
</head>
