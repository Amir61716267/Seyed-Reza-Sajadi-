<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 25px;
    overflow-y: auto;
    overflow-x: hidden;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body::before {
    content: "";
    position: fixed;
    width: 320px;
    height: 320px;
    background: #00d4ff55;
    border-radius: 50%;
    top: -120px;
    left: -120px;
    filter: blur(80px);
}

body::after {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    background: #7c3aed55;
    border-radius: 50%;
    bottom: -150px;
    right: -120px;
    filter: blur(90px);
}

.card {
    position: relative;
    width: 370px;
    max-width: 100%;
    padding: 35px;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 25px 50px rgba(0,0,0,.45);
    text-align: center;
    z-index: 10;
}

h1 {
    margin-bottom: 26px;
    color: #fff;
    font-size: 28px;
    font-weight: 600;
}

.social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 15px;
    padding: 16px;
    border-radius: 18px;
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 500;
    transition: .30s;
}

.social:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.social img {
    width: 28px;
    height: 28px;
    object-fit: contain;
    border-radius: 50%;
    transition: .3s;
}

.eitaa { background: #FF9800; }
.soroush { background: #6C5CE7; }

.social:hover img {
    transform: scale(1.15);
    transition: .3s;
}
</style>
</head>
